name: Deploy Static Site (retired)

# RETIRED by ADR-001: the site now builds in server mode (no dist/index.html),
# so a push to main must not publish it to S3. Kept as a manual fallback only
# until the container deploy (ECS Fargate) is verified, then it will be removed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cdk/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Deploy with CDK
        run: npx cdk deploy StaticSiteStack --require-approval never
        working-directory: cdk
