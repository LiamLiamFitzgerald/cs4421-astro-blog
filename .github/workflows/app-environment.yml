name: App Environment (ECS Fargate)

# Lifecycle of the billable AppServiceStack (ADR-001). Roughly $1.40/day while
# it exists (ALB, Fargate task, public IPv4 addresses), so it is never deployed
# automatically:
#   deploy   - build the image, deploy, smoke-test /api/health, leave it running
#   rehearse - deploy, smoke-test, then ALWAYS destroy (cheap proof it works)
#   destroy  - delete the stack
# A nightly schedule also destroys it, so a forgotten stack costs at most a day.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do with the app environment"
        type: choice
        options: [deploy, rehearse, destroy]
        default: rehearse
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC every night: safety-net destroy

permissions:
  contents: read

concurrency:
  group: app-environment
  cancel-in-progress: false

env:
  ACTION: ${{ github.event.inputs.action || 'destroy' }}

jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Deploy with CDK (builds and pushes the image)
        if: env.ACTION == 'deploy' || env.ACTION == 'rehearse'
        run: npx cdk deploy AppServiceStack --require-approval never --outputs-file outputs.json
        working-directory: cdk

      - name: Smoke test /api/health
        if: env.ACTION == 'deploy' || env.ACTION == 'rehearse'
        working-directory: cdk
        run: |
          URL=$(node -p "require('./outputs.json').AppServiceStack.HealthUrl")
          echo "Checking $URL"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then cat /tmp/health.json; echo; exit 0; fi
            echo "attempt $i: HTTP $CODE"; sleep 15
          done
          echo "Health check failed" >&2
          exit 1

      - name: Destroy AppServiceStack
        # Runs for destroy, the nightly schedule, and always after a rehearsal.
        if: always() && (env.ACTION == 'destroy' || env.ACTION == 'rehearse')
        run: npx cdk destroy AppServiceStack --force
        working-directory: cdk
