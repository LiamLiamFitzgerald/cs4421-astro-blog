name: App Environment (Lambda)

# Lifecycle of AppLambdaStack (ADR-010): the app image on AWS Lambda behind
# CloudFront. Nothing runs while idle, so it costs close to nothing, but it is
# still only deployed on demand:
#   deploy   - build the image, deploy (CodeDeploy canary), smoke-test /api/health
#   rehearse - deploy, smoke-test, then ALWAYS destroy (proof it works)
#   destroy  - delete the stack
# The nightly safety-net destroy used for Fargate (ADR-001) is no longer needed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do with the app environment"
        type: choice
        options: [deploy, rehearse, destroy]
        default: rehearse

permissions:
  contents: read

concurrency:
  group: app-environment
  cancel-in-progress: false

env:
  ACTION: ${{ github.event.inputs.action }}

jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Signed-in pulls from public.ecr.aws (the Lambda Web Adapter) get a much
      # higher rate limit than anonymous ones.
      - name: Sign in to Amazon ECR Public
        if: env.ACTION == 'deploy' || env.ACTION == 'rehearse'
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws \
            || echo "Could not sign in; falling back to anonymous pulls"

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Deploy with CDK (builds and pushes the image, canary via CodeDeploy)
        if: env.ACTION == 'deploy' || env.ACTION == 'rehearse'
        run: npx cdk deploy AppLambdaStack --require-approval never --outputs-file outputs.json
        working-directory: cdk

      - name: Smoke test /api/health
        if: env.ACTION == 'deploy' || env.ACTION == 'rehearse'
        working-directory: cdk
        run: |
          URL=$(node -p "require('./outputs.json').AppLambdaStack.HealthUrl")
          echo "Checking $URL"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then cat /tmp/health.json; echo; exit 0; fi
            echo "attempt $i: HTTP $CODE"; sleep 15
          done
          echo "Health check failed" >&2
          exit 1

      - name: Destroy AppLambdaStack
        # Runs for destroy, and always after a rehearsal.
        if: always() && (env.ACTION == 'destroy' || env.ACTION == 'rehearse')
        run: npx cdk destroy AppLambdaStack --force
        working-directory: cdk
